name: Build PokeL-ARecomp (Windows & Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 Build
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Configure Git Line Endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 UCRT64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: make git python nasm diffutils
          pacboy: clang:p lld:p gcc:p binutils:p python:p sdl3:p ffmpeg:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p vulkan-memory-allocator:p nasm:p diffutils:p

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows Package
        shell: msys2 {0}
        run: |
          export ZIP=1
          bash tools/za/dist.sh

      - name: Rename Output Zip
        shell: pwsh
        run: |
          if (Test-Path "build/dist-za/ZA-Recomp-windows.zip") {
            Move-Item -Force "build/dist-za/ZA-Recomp-windows.zip" "build/dist-za/PokeL-ARecomp-windows-x64.zip"
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeL-ARecomp-windows-x64
          path: build/dist-za/PokeL-ARecomp-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: docker build -t za-linux-build -f tools/linux/Containerfile tools/linux

      - name: Compile AppImage
        run: |
          docker run --rm -v "$PWD:/src" -w /src za-linux-build bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends dotnet-sdk-8.0 python3-venv
            git config --global --add safe.directory /src
            PYTHON=python3.12 tools/za/dist-linux.sh'

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeL-ARecomp-linux-x86_64
          path: build/dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: PokeL-ARecomp-windows-x64
          path: dist-release

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: PokeL-ARecomp-linux-x86_64
          path: dist-release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.zip
            dist-release/*.AppImage
          name: "PokeL-ARecomp ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## PokeL-ARecomp (PLA Recomp) ${{ github.ref_name }}
            
            Native PC port of **Pokémon Legends: Arceus** (1.1.1).
            
            ### Included in this release:
            - **Windows x64**: `PokeL-ARecomp-windows-x64.zip`
            - **Linux x86_64**: `PokeL-ARecomp-linux-x86_64.AppImage`
            
            ### Highlights:
            - Dedicated Intel Arc B580 12GB VRAM pool unlocking and Battlemage Xe2 tuning.
            - Intel Xeon high-core count multi-threading texture streaming.
            - Intel XeSS SDK AI neural upscaling support.
            - Brand new Pokémon Legends: Arceus Celestial Arc artwork and launcher theme.
